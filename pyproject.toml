[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intel-agent"
version = "0.1.0"
requires-python = ">=3.10"
# Ranges are guard rails (lowest tested version .. next breaking line). The exact
# versions everything is verified against live in constraints.txt.
# sqlalchemy stays below 2.1 on purpose: 2.1 changed the default PostgreSQL driver.
dependencies = [
    "pydantic>=2.13,<3",
    "openai>=3.13,<4",
    "python-dotenv>=1.2,<2",
    "firecrawl-py>=4.43,<5",
    "fastapi>=0.141,<1",
    "uvicorn>=0.53,<1",
    "sqlalchemy>=2.0.54,<2.1",
    "psycopg2-binary>=2.9.13,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
