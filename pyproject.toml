[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intel-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "openai",
    "python-dotenv",
    "firecrawl-py",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
]

[tool.setuptools.packages.find]
where = ["src"]
