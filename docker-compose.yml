services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: market_intel
      POSTGRES_PASSWORD: market_intel
      POSTGRES_DB: market_intel
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      # Dentro da rede do Docker, "db" é o nome do serviço acima — não
      # localhost, não a porta 5433 (aquela era só pra acesso do host,
      # pra não colidir com o Postgres nativo do Windows).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: market_intel
      POSTGRES_PASSWORD: market_intel
      POSTGRES_DB: market_intel
      DEEP_SEEK_API_KEY: ${DEEP_SEEK_API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
