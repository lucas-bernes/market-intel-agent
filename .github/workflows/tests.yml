name: Tests

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: pytest
        # No secrets needed: tests/conftest.py forces DATABASE_URL to a
        # temporary SQLite file and fakes the API keys before any import.
