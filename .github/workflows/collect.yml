name: Scheduled data collection

# Daily, plus a manual button (Actions tab > this workflow > Run workflow)
# for testing without waiting for the schedule. Cron times are UTC.
on:
  schedule:
    - cron: "0 9 * * *" # every day, 09:00 UTC (~06:00 America/Sao_Paulo)
  workflow_dispatch: {}

permissions:
  contents: write # to push the generated snapshot to gh-pages
  pages: write
  id-token: write
  issues: write # the catalog/price watch opens an issue when something changed

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package
        run: pip install -c constraints.txt -e .

      - name: Run scheduled collection (facts only, fixed sources)
        id: collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEP_SEEK_API_KEY: ${{ secrets.DEEP_SEEK_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python scripts/run_collection.py
        # A fully rejected target must not stop the site from being refreshed:
        # the other targets' data is already saved and consistent (a failed
        # target simply keeps its previous values). So the job keeps going and
        # the last step turns the run red instead, which is what makes GitHub
        # email the alert. Before this, one flaky target froze the whole site.
        continue-on-error: true

      # Watches the public catalogs of fal.ai, Runware, PiAPI, AIMLAPI and Replicate
      # for new / gone / repriced / promotional endpoints. No LLM, no API keys.
      # Appends its findings to catalog_report.md (the collection step may have
      # started that file with price alerts for the tracked models).
      - name: Scan aggregator catalogs
        id: catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/scan_catalog.py
        continue-on-error: true

      # One issue per run, only when there is something to say. It is assigned to the
      # repository owner, and GitHub emails assignees according to their notification
      # settings (the address must be the one set in GitHub > Settings > Notifications).
      - name: Open an issue with the changes
        id: issue
        if: hashFiles('catalog_report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create catalog --color BFD4F2 --description "Catalog and price watch" || true
          gh issue create \
            --title "Catalog and price watch $(date -u +%F)" \
            --label catalog \
            --assignee "${{ github.repository_owner }}" \
            --body-file catalog_report.md
        continue-on-error: true

      # Only after the issue exists: otherwise the events stay pending and are
      # reported again by the next run.
      - name: Mark the events as notified
        if: steps.issue.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/scan_catalog.py --mark-notified

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Export static snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/export_static.py

      - name: Prepare Pages payload
        run: |
          mkdir -p public
          cp export/market-intel-snapshot.html public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Fail the run if a collection target, a catalog source or the issue step failed
        if: steps.collect.outcome == 'failure' || steps.catalog.outcome == 'failure' || steps.issue.outcome == 'failure'
        run: |
          echo "collection: ${{ steps.collect.outcome }} | catalog scan: ${{ steps.catalog.outcome }} | issue: ${{ steps.issue.outcome }}"
          echo "See the run summary and the step logs. The site was still published with the data in the database."
          exit 1
